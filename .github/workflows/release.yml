name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 새 릴리즈를 받아 쓰는 저장소에 알린다. 받는 쪽은 design-system-released 이벤트로 반영한다
      # DOWNSTREAM_DISPATCH_TOKEN: 받는 저장소의 Contents 읽기·쓰기 권한이 있는 fine-grained PAT
      - name: Notify downstream
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
          DOWNSTREAM: daewoong-axtf/ax-desk-fe
        run: |
          tag=$(git tag --points-at HEAD 'v*' | head -1)
          if [ -z "$tag" ]; then echo "새 릴리즈 없음"; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DOWNSTREAM_DISPATCH_TOKEN이 없어 $tag 릴리즈를 알리지 않았다. 받는 쪽은 하루 한 번 확인할 때 반영한다"
            exit 0
          fi
          for repo in $DOWNSTREAM; do
            gh api "repos/$repo/dispatches" -f event_type=design-system-released -f "client_payload[tag]=$tag"
            echo "$repo ← $tag"
          done
