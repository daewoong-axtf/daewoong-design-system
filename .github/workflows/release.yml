name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 새 릴리즈를 받아 쓰는 저장소에 알린다. 받는 쪽은 design-system-released 이벤트로 반영한다
      # 조직의 GitHub App(받는 저장소에만 설치, Contents 읽기·쓰기)으로 실행할 때마다 짧은 토큰을 받는다
      #   변수 DOWNSTREAM_APP_ID · 시크릿 DOWNSTREAM_APP_PRIVATE_KEY
      - name: Check new release
        id: release
        env:
          APP_ID: ${{ vars.DOWNSTREAM_APP_ID }}
          APP_KEY: ${{ secrets.DOWNSTREAM_APP_PRIVATE_KEY }}
        run: |
          tag=$(git tag --points-at HEAD 'v*' | head -1)
          if [ -z "$tag" ]; then echo "새 릴리즈 없음"; exit 0; fi
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::warning::DOWNSTREAM_APP_ID · DOWNSTREAM_APP_PRIVATE_KEY가 없어 $tag 릴리즈를 알리지 않았다. 받는 쪽은 하루 한 번 확인할 때 반영한다"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v2
        id: app-token
        if: steps.release.outputs.tag != ''
        with:
          app-id: ${{ vars.DOWNSTREAM_APP_ID }}
          private-key: ${{ secrets.DOWNSTREAM_APP_PRIVATE_KEY }}
          owner: daewoong-axtf
          repositories: ax-desk-fe
          permission-contents: write

      - name: Notify downstream
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag }}
          DOWNSTREAM: daewoong-axtf/ax-desk-fe
        run: |
          for repo in $DOWNSTREAM; do
            gh api "repos/$repo/dispatches" -f event_type=design-system-released -f "client_payload[tag]=$TAG"
            echo "$repo ← $TAG"
          done
